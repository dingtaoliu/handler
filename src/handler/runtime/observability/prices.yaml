# Model prices in USD per million tokens, Standard tier.
#
# Source: OpenAI API pricing, https://developers.openai.com/api/docs/pricing
# (platform.openai.com/docs/pricing redirects there), checked 2026-10-18.
# Cache-write billing: https://developers.openai.com/api/docs/guides/prompt-caching
#
# Token kinds (see pricing.py): input_tokens includes cache reads and cache
# writes; each input token is billed at exactly one of input, cached_input or
# cache_write. Reasoning tokens are part of output and billed at the output rate.
# long_context: a single request with more than above_input_tokens input tokens
# is billed entirely at those rates (OpenAI: short context <= 272K tokens).
#
# Not modelled here: hosted web search costs $10.00 per 1k calls plus search
# content tokens "billed at model rates" (those arrive in the usage token counts
# and are priced below). The per-call fee has no field in this schema yet.
#
# `model` may be an exact name or a glob; exact beats glob, and the latest
# effective_from <= the usage time wins. A model with no entry, or a needed
# rate that is null, yields cost_usd = None (unpriced). effective_from is the
# date these rates were verified, not the vendor's launch date.
prices:
  - model: "gpt-6.1-sol"
    effective_from: 2026-10-18
    input_per_mtok: 2.0
    cached_input_per_mtok: 0.1
    cache_write_per_mtok: 2.5
    output_per_mtok: 10.0
    long_context:
      above_input_tokens: 272000
      input_per_mtok: 4.0
      cached_input_per_mtok: 0.2
      cache_write_per_mtok: 5.0
      output_per_mtok: 15.0
  - model: "gpt-6-astra"
    effective_from: 2026-10-18
    input_per_mtok: 10.0
    cached_input_per_mtok: 1.0
    cache_write_per_mtok: 12.5
    output_per_mtok: 50.0
    long_context:
      above_input_tokens: 272000
      input_per_mtok: 20.0
      cached_input_per_mtok: 2.0
      cache_write_per_mtok: 25.0
      output_per_mtok: 75.0
  - model: "gpt-6-sol"
    effective_from: 2026-10-18
    input_per_mtok: 2.0
    cached_input_per_mtok: 0.2
    cache_write_per_mtok: 2.5
    output_per_mtok: 10.0
    long_context:
      above_input_tokens: 272000
      input_per_mtok: 4.0
      cached_input_per_mtok: 0.4
      cache_write_per_mtok: 5.0
      output_per_mtok: 15.0
  - model: "gpt-6-luna"
    effective_from: 2026-10-18
    input_per_mtok: 0.1
    cached_input_per_mtok: 0.01
    cache_write_per_mtok: 0.125
    output_per_mtok: 0.5
    long_context:
      above_input_tokens: 272000
      input_per_mtok: 0.2
      cached_input_per_mtok: 0.02
      cache_write_per_mtok: 0.25
      output_per_mtok: 0.75
  # The page says "GPT-5.6 Sol's promotional pricing is available at least
  # through November 21, 2026"; these are the rates it lists today. Re-check then.
  - model: "gpt-5.6-sol"
    effective_from: 2026-10-18
